[project]
name = "expressdelivery"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "httpx>=0.28.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.2",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "celery-types>=0.26.0",
    "pre-commit>=4.6.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
